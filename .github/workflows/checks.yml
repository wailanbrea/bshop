name: BShop checks
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, pdo_sqlite, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: php vendor/bin/pint --test
      - run: php artisan test
      - run: npm ci
      - run: npm run build
  browsers:
    needs: application
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: ipad-portrait-webkit
            engine: webkit
          - project: ipad-landscape-webkit
            engine: webkit
          - project: android-portrait-chromium
            engine: chromium
          - project: tablet-wide-chromium
            engine: chromium
          - project: desktop-chromium
            engine: chromium
          - project: mobile-webkit
            engine: webkit
    env:
      BSHOP_BROWSER_OFFLINE: '1'
      PLAYWRIGHT_BROWSERS_PATH: .runtime/playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser engine
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:tablet -- --project=${{ matrix.project }} --reporter=dot
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tablet-browser-evidence-${{ matrix.project }}
          path: |
            playwright-report
            test-results/tablet
          if-no-files-found: ignore
